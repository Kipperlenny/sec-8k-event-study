[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sec-events"
version = "1.0.0"
description = "Loader and reproducible event-study benchmark for the SEC 8-K Event Dataset (aiamond)"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "numpy>=1.24"]

[project.optional-dependencies]
yahoo = ["yfinance>=0.2"]
notebook = ["jupyter", "matplotlib"]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["sec_events*"]
